<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculater</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
  
<div class="calculater">
    <div id="inputBox">0</div>
  <div class="keys">
      <div class="row1">
        <button>AC</button>
        <button>%</button>
        <button>/</button>
        <button>DEL</button>
    </div>
        <div class="row2">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>*</button>
    </div>

        <div class="row3">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>
    </div>
        <div class="row4">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>
    </div>
        <div class="row5">
        <button>0</button>
        <button>.</button>
        <button class="equal">=</button>
    </div>
  </div>
</div>
</body>
<script src="./index.js"></script>
</html>
